    <meta property="og:description" content="A comprehensive academic and community platform for hospitality students, featuring study resources, news, and real-time collaboration." />
    <meta name="google-site-verification" content="google9d37e6cfa0ce3868" />
    <script>
      // Defensive handling for third-party browser extensions attempting to monkey-patch window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          var activeFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return activeFetch; },
            set: function(fn) { activeFetch = fn; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if environment prevents redefining fetch
        }

        // Prevent external extension errors from polluting app lifecycle
        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            var str = String(event.reason.stack || event.reason.message || event.reason);
            if (str.indexOf('chrome-extension://') !== -1 || str.indexOf('Cannot set property fetch') !== -1) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
